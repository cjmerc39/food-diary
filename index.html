// ---- charts ------------------------------------------------------------------------------
// Inline SVG in a 340-unit-wide viewBox that scales to its card. The load
// chart and the category strips share one x geometry, so their days line up.
const CHART_W = 340;
const PAD_L = 24;
const PAD_R = 12;
const charts = new Map();   // interactive chart id -> its series, for the day readout
let chartSeq = 0;

const slotWidth = (n) => (CHART_W - PAD_L - PAD_R) / n;
const slotMid = (n, i) => PAD_L + (i + 0.5) * slotWidth(n);
const round1 = (v) => Math.round(v * 10) / 10;
const dayShort = (day) => parseLocal(`${day}T00:00`).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// A food keeps its band color wherever it shows up (see phaseTagSlots).
function bandColor(tag) {
  const slot = phaseTagSlots(S.phases).get(tag);
  return slot == null || slot < 0 ? 'var(--ink3)' : `var(--band-${slot})`;
}

function loadChartHtml(series, bands, { interactive = false } = {}) {
  const id = `chart${++chartSeq}`;
  const n = series.length;
  // Each food in range gets its own horizontal track behind the line, so
  // overlapping phases (dairy and soy out at once) stay distinct instead of
  // blending. Labels sit in one row per track above the plot, clear of the data.
  const slots = phaseTagSlots(S.phases);
  const slotRank = (tag) => (slots.has(tag) && slots.get(tag) >= 0 ? slots.get(tag) : 99);
  const tracks = [...new Set(bands.map((b) => b.tag))].sort((a, b) => slotRank(a) - slotRank(b));
  const rowH = 13;
  const top = 6 + tracks.length * rowH + (tracks.length ? 4 : 0);
  const plotH = 128, bottom = top + plotH, H = bottom + 22;
  const trackH = plotH / Math.max(1, tracks.length);
  const logged = series.map((d, i) => [d, i]).filter(([d]) => d.hasData);
  const peakLoad = Math.max(0, ...logged.map(([d]) => d.load));
  const yMax = Math.min(20, Math.max(5, Math.ceil(peakLoad / 5) * 5));
  const y = (v) => bottom - (v / yMax) * plotH;
  const at = new Map(series.map((d, i) => [d.day, i]));

  const patterns = new Set();
  const labelEnds = new Map();
  const bandSvg = [...bands].sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0)).map((b) => {
    const t = tracks.indexOf(b.tag);
    const x0 = PAD_L + at.get(b.from) * slotWidth(n);
    const x1 = PAD_L + (at.get(b.to) + 1) * slotWidth(n);
    const ty = top + t * trackH;
    const color = bandColor(b.tag);
    const back = b.kind === 'reintroduce';
    const pid = `${id}-p${t}`;   // by track, so no tag text ends up in an id
    if (back) {
      patterns.add(`<pattern id="${pid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`
        + `<rect width="6" height="6" style="fill:${color};opacity:.08"/><rect width="2" height="6" style="fill:${color};opacity:.45"/></pattern>`);
    }
    let svg = `<rect x="${round1(x0)}" y="${round1(ty)}" width="${round1(x1 - x0)}" height="${round1(trackH)}" style="${back ? `fill:url(#${pid})` : `fill:${color};opacity:.16`}"/>`;
    if (!b.clippedStart) svg += `<rect x="${round1(x0)}" y="${round1(ty)}" width="1.5" height="${round1(trackH)}" style="fill:${color}"/>`;
    // Label at the band's start in its track's row, skipped if it would run
    // into the label before it (the legend always names every band).
    const text = `${tagLabel(S.settings, b.tag)} ${back ? 'back' : 'out'}`;
    const width = 9 + text.length * 5.6;
    const left = Math.min(x0, CHART_W - 2 - width);
    if (left >= (labelEnds.has(t) ? labelEnds.get(t) + 6 : -Infinity)) {
      labelEnds.set(t, left + width);
      const ly = 6 + t * rowH;
      svg += `<rect x="${round1(left)}" y="${ly + 3}" width="6" height="6" rx="1.5" style="fill:${color}"/>`
        + `<text class="band-label" x="${round1(left + 9)}" y="${ly + 9}">${esc(text)}</text>`;
    }
    return svg;
  }).join('');

  const grid = [0, yMax / 2, yMax].map((v) =>
    `<line class="grid" x1="${PAD_L}" x2="${CHART_W - PAD_R}" y1="${round1(y(v))}" y2="${round1(y(v))}"/>`
    + (Number.isInteger(v) ? `<text class="tick" x="${PAD_L - 6}" y="${round1(y(v) + 4)}" text-anchor="end">${v}</text>` : '')).join('');

  // Days before the diary began break the line instead of dropping it to zero.
  let line = '', area = '', run = [];
  const flush = () => {
    if (run.length) {
      const pts = run.map(([x, v]) => `${round1(x)},${round1(v)}`).join('L');
      line += `M${pts}`;
      area += `M${round1(run[0][0])},${bottom}L${pts}L${round1(run[run.length - 1][0])},${bottom}Z`;
    }
    run = [];
  };
  series.forEach((d, i) => { if (d.hasData) run.push([slotMid(n, i), y(d.load)]); else flush(); });
  flush();

  // Direct labels only where the story is: the latest day and the peak.
  let marks = '';
  if (logged.length) {
    const [last, li] = logged[logged.length - 1];
    const [peak, pi] = logged.reduce((m, c) => (c[0].load > m[0].load ? c : m));
    // Above the point, or beside it when a spike reaches the top of the plot.
    const valueLabel = (x, v) => {
      const nearRight = x > CHART_W - PAD_R - 16;
      if (y(v) - 9 >= top + 10) {
        return `<text class="value" x="${round1(x)}" y="${round1(y(v) - 9)}" text-anchor="${nearRight ? 'end' : x < PAD_L + 16 ? 'start' : 'middle'}">${v}</text>`;
      }
      return `<text class="value" x="${round1(nearRight ? x - 7 : x + 7)}" y="${round1(y(v) + 10)}" text-anchor="${nearRight ? 'end' : 'start'}">${v}</text>`;
    };
    marks += `<circle class="dot" cx="${round1(slotMid(n, li))}" cy="${round1(y(last.load))}" r="4"/>${valueLabel(slotMid(n, li), last.load)}`;
    if (pi !== li && peak.load > 0) marks += valueLabel(slotMid(n, pi), peak.load);
  }

  const ticks = n < 2 ? [0] : n < 8 ? [0, n - 1] : [0, Math.round((n - 1) / 2), n - 1];
  const xLabels = ticks.map((i, k) => {
    const first = k === 0, last = !first && k === ticks.length - 1;
    return `<text x="${round1(first ? PAD_L : last ? CHART_W - PAD_R : slotMid(n, i))}" y="${H - 5}" text-anchor="${first ? 'start' : last ? 'end' : 'middle'}">${esc(dayShort(series[i].day))}</text>`;
  }).join('');

  if (interactive) charts.set(id, series);
  const label = `Daily symptom load, ${dayShort(series[0].day)} to ${dayShort(series[n - 1].day)}`;
  return `<svg class="chart" id="${id}" viewBox="0 0 ${CHART_W} ${H}" role="img" aria-label="${esc(label)}"${interactive ? ' data-chart tabindex="0"' : ''}>`
    + `<defs>${[...patterns].join('')}</defs>${bandSvg}${grid}<path class="area" d="${area}"/><path class="line" d="${line}"/>${marks}${xLabels}`
    + (interactive ? `<line class="cross" x1="0" x2="0" y1="${top}" y2="${bottom}" visibility="hidden"/>` : '')
    + `</svg>${interactive ? '<div class="tip" hidden></div>' : ''}`;
}

function bandLegendHtml(bands) {
  const seen = new Map();
  for (const b of bands) if (!seen.has(`${b.tag}:${b.kind}`)) seen.set(`${b.tag}:${b.kind}`, b);
  if (!seen.size) return '<p class="fine">No phases in this range.</p>';
  return `<div class="legend">${[...seen.values()].map((b) =>
    `<span><i class="swatch${b.kind === 'reintroduce' ? ' hatch' : ''}" style="--sw:${bandColor(b.tag)}"></i>${esc(tagLabel(S.settings, b.tag))} ${b.kind === 'reintroduce' ? 'reintroduced' : 'eliminated'}</span>`).join('')}</div>`;
}

// Small multiples: one row per category, on the same days as the load chart.
function categoryStripHtml(series) {
  const n = series.length, H = 24, base = H - 1;
  const w = Math.max(1, Math.min(24, slotWidth(n) - 2));   // 2 units of card between neighbors
  const bar = (x, top, h) => {
    const r = Math.min(4, w / 2, h);
    return `M${round1(x)},${base}V${round1(top + r)}Q${round1(x)},${round1(top)} ${round1(x + r)},${round1(top)}`
      + `H${round1(x + w - r)}Q${round1(x + w)},${round1(top)} ${round1(x + w)},${round1(top + r)}V${base}Z`;
  };
  return LOAD_CATS.map((c) => {
    const bars = series.map((d, i) => {
      const v = d.hasData ? d.cats[c] : 0;
      if (!v) return '';
      const h = (v / 3) * (H - 3);
      return `<path class="bar" d="${bar(slotMid(n, i) - w / 2, base - h, h)}"/>`;
    }).join('');
    return `<div class="strip-row"><span class="strip-label">${CATS[c].label}</span>
      <svg class="strip" viewBox="0 0 ${CHART_W} ${H}" aria-hidden="true"><line class="grid" x1="${PAD_L}" x2="${CHART_W - PAD_R}" y1="${base + 0.5}" y2="${base + 0.5}"/>${bars}</svg></div>`;
  }).join('');
}

// Day readout: tap or drag across the chart, hover with a mouse, or focus it
// and use the arrow keys. Everything it shows is also in "Daily numbers".
function chartTip(svg, index) {
  const series = charts.get(svg.id);
  if (!series) return;
  const n = series.length;
  const i = Math.max(0, Math.min(n - 1, index));
  svg.dataset.sel = i;
  const x = round1(slotMid(n, i));
  const cross = svg.querySelector('.cross');
  cross.setAttribute('x1', x);
  cross.setAttribute('x2', x);
  cross.setAttribute('visibility', 'visible');
  const d = series[i];
  const tip = svg.nextElementSibling;
  tip.replaceChildren();
  const add = (text, cls = '') => {
    const s = document.createElement('span');
    s.textContent = text;
    if (cls) s.className = cls;
    tip.append(s);
  };
  add(dayShort(d.day));
  if (!d.hasData) {
    add('Before the diary began', 'tip-value');
  } else {
    add(`Load ${d.load}`, 'tip-value');
    const cats = LOAD_CATS.filter((c) => d.cats[c]).map((c) => `${CATS[c].label} ${d.cats[c]}`);
    const flags = Object.keys(d.flags).filter((f) => d.flags[f]).map((f) => FLAG_LABELS[f]);
    if (cats.length) add(cats.join(', '));
    if (flags.length) add(flags.join(', '));
    if (!cats.length && !flags.length) add('No symptoms logged');
  }
  tip.hidden = false;
  const card = svg.parentElement.getBoundingClientRect();
  const box = svg.getBoundingClientRect();
  const px = box.left - card.left + (x / CHART_W) * box.width;
  tip.style.left = `${Math.max(6, Math.min(card.width - tip.offsetWidth - 6, px - tip.offsetWidth / 2))}px`;
  tip.style.top = `${Math.max(6, box.top - card.top - tip.offsetHeight - 4)}px`;
}

function hideChartTips(keep = null) {
  for (const svg of document.querySelectorAll('svg[data-chart]')) {
    if (svg === keep) continue;
    svg.querySelector('.cross').setAttribute('visibility', 'hidden');
    svg.nextElementSibling.hidden = true;
    delete svg.dataset.sel;
  }
}

const chartIndexAt = (svg, clientX) => {
  const box = svg.getBoundingClientRect();
  return Math.floor((((clientX - box.left) / box.width) * CHART_W - PAD_L) / slotWidth(charts.get(svg.id).length));
};
const chartOf = (target) => (target && target.closest ? target.closest('svg[data-chart]') : null);

document.addEventListener('pointerdown', (e) => {
  const svg = chartOf(e.target);
  hideChartTips(svg);
  if (svg && charts.has(svg.id)) chartTip(svg, chartIndexAt(svg, e.clientX));
});
document.addEventListener('pointermove', (e) => {
  const svg = chartOf(e.target);
  if (svg && charts.has(svg.id) && (e.pointerType === 'mouse' || e.buttons)) chartTip(svg, chartIndexAt(svg, e.clientX));
});
document.addEventListener('pointerout', (e) => {
  const svg = e.pointerType === 'mouse' && chartOf(e.target);
  if (svg && !svg.contains(e.relatedTarget)) hideChartTips();
});
document.addEventListener('focusin', (e) => {
  const svg = chartOf(e.target);
  if (svg && svg === e.target && charts.has(svg.id) && svg.dataset.sel == null) chartTip(svg, charts.get(svg.id).length - 1);
});
document.addEventListener('focusout', (e) => {
  if (chartOf(e.target) === e.target) hideChartTips();
});

// ---- phases ------------------------------------------------------------------------------

function viewPhases() {
  const now = nowTs();
  const list = sortPhases(S.phases, now);
  const add = `<button class="btn addbtn" data-act="add-phase">${ICON.plus}<span>Add a phase</span></button>`;
  if (!list.length) {
    return empty('phases', 'No phases yet',
      'When a food comes out of your diet, or goes back in, add it here. Phases power the exposure alerts and the trend charts.') + add;
  }
  return `<div class="stack">${list.map((p) => phaseCard(p, now)).join('')}</div>${add}`;
}

function phaseCard(p, now) {
  const label = tagLabel(S.settings, p.tag);
  const kind = p.kind === 'reintroduce' ? 'reintroduction' : 'elimination';
  const active = isPhaseActive(p, now);
  const day = phaseDay(p, now);
  const what = `${label.toLowerCase()} ${kind}`;
  const headline = day === 0 ? `Upcoming ${what}` : active ? `Day ${day} of ${what}` : `${plural(day, 'day')} of ${what}`;
  const status = active ? 'Active' : day === 0 ? 'Upcoming' : 'Ended';
  const dates = `${day === 0 ? 'Starts' : 'Since'} ${fmtDate(p.start)}${p.end ? `, ended ${fmtDate(p.end)}` : ''}`;
  return `
    <button class="card phase" data-act="edit-phase" data-id="${esc(p.id)}">
      <span class="phase-top"><span class="tagpill${p.kind === 'reintroduce' ? ' sym' : ''}">${esc(label)}</span><span class="status${active ? ' on' : ''}">${status}</span></span>
      <span class="phase-title">${esc(headline)}</span>
      <span class="fine">${esc(dates)}</span>
      ${p.note ? `<span class="note">${esc(p.note)}</span>` : ''}
    </button>`;
}

function viewMore() {
  const tags = allTags(S.settings);
  const hidden = tags.filter((t) => t.hidden).length;
  const row = (act, label, sub = '') =>
    `<button class="row" data-act="${act}"><span class="row-main">${esc(label)}${sub ? `<span class="row-sub">${esc(sub)}</span>` : ''}</span>${ICON.right}</button>`;
  return `
    <section class="card about">
      <div class="about-head">${ICON.lock}<h2>Private by design</h2></div>
      <p>Nothing you log leaves this phone. There's no account, no cloud copy, and no tracking.</p>
      <p class="fine">Build ${BUILD} · ${isStandalone() ? 'Home Screen app' : 'running in the browser'}</p>
    </section>
    <h3 class="section-label">For the doctor</h3>
    <div class="card rows">${row('open-report', 'Report for your pediatrician', 'Phases, the chart, suspects, and the full log, ready to print or save as a PDF')}</div>
    <h3 class="section-label">Backups</h3>
    <div class="card rows">
      ${row('export', 'Back up now', backupStatus())}
      ${row('import', 'Restore from a backup', 'Merge a backup file into this diary, or replace it')}
    </div>
    <h3 class="section-label">Settings</h3>
    <div class="card rows">
      ${row('edit-name', "Baby's name", S.babyName.trim() || 'Not set')}
      ${row('edit-tags', 'Allergen tags', `${tags.length - hidden} shown${hidden ? `, ${hidden} hidden` : ''}`)}
      <div class="row row-block">
        <span class="row-main">Suspects window<span class="row-sub">How many hours after eating a food count as "followed by symptoms"</span></span>
        ${windowChipsHtml(S.settings.windowHours)}
      </div>
    </div>
    <h3 class="section-label">Danger zone</h3>
    <div class="card rows"><button class="row danger" data-act="clear-all"><span class="row-main">Clear all data<span class="row-sub">Deletes this diary from this phone</span></span></button></div>`;
}

function backupStatus() {
  if (!S.lastBackup) return 'Never backed up';
  const days = daysBetween(dayKey(S.lastBackup), todayKey());
  return days <= 0 ? 'Last backup: today' : days === 1 ? 'Last backup: yesterday' : `Last backup: ${days} days ago`;
}

// ---- report ------------------------------------------------------------------------------
// The pediatrician handout: a page styled for print, so Print (or saving a PDF
// from the print preview) makes a clean copy. The bar, range controls, and
// buttons are screen-only.
const fmtFull = (ts) => parseLocal(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

function showReport() {
  const { fromDay, toDay } = trendDays(S, U.trendRange, todayKey());
  U.report = { preset: U.trendRange, from: fromDay, to: toDay };
  $('#report').innerHTML = `
    <div class="report-bar noprint">
      <button class="navbtn" data-act="report-close" aria-label="Back to More">${ICON.left}</button>
      <h1 class="report-bar-title">Report</h1>
      <button class="btn btn-primary report-print" data-act="report-print">Print or save PDF</button>
    </div>
    <div class="report-scroll"></div>`;
  showScreen('report');
  renderReport();
}

function renderReport() {
  const scroll = $('#report .report-scroll');
  const top = scroll.scrollTop;
  scroll.innerHTML = `${reportControlsHtml()}${reportHtml()}
    <button class="btn addbtn noprint" data-act="report-share">Share as a file</button>
    <button class="btn btn-primary addbtn noprint" data-act="report-print">Print or save PDF</button>
    <p class="fine noprint print-hint">In the print preview, tap Share to save a PDF or send it. Share as a file sends a copy you can open and print from Files, Mail, or AirDrop.</p>`;
  scroll.scrollTop = top;
}

// Home Screen apps have no Safari toolbar, and on some iOS versions
// window.print() silently does nothing there. If no print starts, say so.
function printReport() {
  let started = false;
  const mark = () => { started = true; };
  addEventListener('beforeprint', mark, { once: true });
  window.print();
  setTimeout(() => {
    removeEventListener('beforeprint', mark);
    if (!started) toast("Printing didn't open here. Use Share as a file, then print it from Files or send it.", { ms: 9000 });
  }, 1500);
}

// A self-contained copy of the report: page styles included, always the light
// palette, scrollable anywhere it's opened.
async function shareReport() {
  const styles = [...document.querySelectorAll('style')].map((s) => s.textContent).join('\n');
  const standalone = ':root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--sunk:#f2ede4;--line:#ddd3c7;--ink:#1f1b17;--ink2:#564e45;'
    + '--ink3:#8a8075;--sym:#34766f;--danger:#a33b2c;--band-0:#2a78d6;--band-1:#eb6834;--band-2:#1baf7a;--band-3:#eda100;'
    + '--band-4:#e87ba4;--band-5:#008300;--band-6:#4a3aa7;--band-7:#e34948}'
    + 'body{height:auto!important;overflow:visible!important;display:block!important;padding:16px}.report{border:0;padding:0}';
  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">`
    + `<title>${esc(APP_NAME)} report</title><style>${styles}\n${standalone}</style></head><body>${reportHtml()}</body></html>`;
  const name = `${slugify(APP_NAME)}-report-${U.report.to}.html`;
  await shareFile(new File([html], name, { type: 'text/html' }), `${APP_NAME} report`);
}

function reportControlsHtml() {
  const { preset, from, to } = U.report;
  const today = todayKey();
  return `<section class="card report-controls noprint">
    <span class="sect-label">Date range</span>
    ${rangeChipsHtml('report-range', preset)}
    <div class="report-dates">
      <label><span>From</span><input class="date wide" type="date" data-field="report-from" value="${from}" max="${today}"></label>
      <label><span>To</span><input class="date wide" type="date" data-field="report-to" value="${to}" max="${today}"></label>
    </div>
  </section>`;
}

function entryDetail({ kind, e }) {
  if (kind === 'food') return e.note ? `${e.name} (${e.note})` : e.name;
  const sev = Number.isFinite(e.severity) ? e.severity : 0;
  const bits = [symptomName(e), sev ? `severity ${sev}` : '', ...(e.flags || []).map((f) => (FLAG_LABELS[f] || f).toLowerCase())];
  return bits.filter(Boolean).join(', ') + (e.note ? ` (${e.note})` : '');
}

function entryTags({ kind, e }) {
  if (kind !== 'food') return '';
  const tags = e.tags || [];
  return [...tags.map((t) => tagLabel(S.settings, t)),
    ...(e.uncertain || []).filter((t) => !tags.includes(t)).map((t) => `${tagLabel(S.settings, t)}?`)].join(', ');
}

function reportHtml() {
  const { from, to } = U.report;
  const now = nowTs();
  const hours = S.settings.windowHours;
  const name = S.babyName.trim();
  const series = trendSeries(S, from, to);
  const bands = phaseBands(S.phases, from, to);
  const sus = suspectData(from, `${to}T23:59`);
  const entries = rangeEntries(S, from, to);
  const table = (head, rows, cls = '') => `<div class="table-wrap"><table${cls ? ` class="${cls}"` : ''}>`
    + `<thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;

  const phaseRows = [...S.phases].sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0)).map((p) => {
    const day = phaseDay(p, now);
    const length = day === 0 ? 'not started' : p.end && p.end <= now ? plural(day, 'day') : `${plural(day, 'day')} so far`;
    return `<tr><td>${esc(tagLabel(S.settings, p.tag))}</td><td>${p.kind === 'reintroduce' ? 'Reintroduced' : 'Eliminated'}</td>`
      + `<td class="nowrap">${esc(fmtFull(p.start))}</td><td class="nowrap">${p.end ? esc(fmtFull(p.end)) : 'ongoing'}</td>`
      + `<td class="nowrap">${length}</td><td>${esc(p.note || '')}</td></tr>`;
  }).join('');

  const suspectRows = sus.ranked.map((row) => `<tr><td>${esc(tagLabel(S.settings, row.tag))}</td><td>${esc(exposureText(row))}</td>`
    + `<td class="nowrap">${row.followed} of ${row.complete}</td><td>${row.ratio == null ? 'no symptoms in range' : `${fmtRatio(row.ratio)} baseline`}</td></tr>`).join('');
  const few = sus.notEnough.map((row) => `${tagLabel(S.settings, row.tag)} (${exposureText(row)})`).join(', ');

  const logRows = entries.map((r) => `<tr><td class="nowrap">${esc(fmtDate(r.e.ts, { weekday: true }))}</td><td class="nowrap">${esc(fmtTime(r.e.ts))}</td>`
    + `<td>${r.kind === 'food' ? 'Food' : 'Symptom'}</td><td>${esc(entryDetail(r))}</td><td>${esc(entryTags(r))}</td></tr>`).join('');

  return `<article class="report">
    <header>
      <h1>Food and symptom diary${name ? `: ${esc(name)}` : ''}</h1>
      <p class="report-meta">${esc(fmtFull(`${from}T00:00`))} to ${esc(fmtFull(`${to}T00:00`))} · generated ${esc(fmtFull(now))}</p>
      <p class="report-meta">For discussion with our pediatrician.</p>
    </header>
    <section>
      <h2>Phases</h2>
      ${phaseRows ? table(['Food', 'Change', 'Started', 'Ended', 'Length', 'Note'], phaseRows) : '<p class="report-meta">No phases recorded.</p>'}
    </section>
    <section class="keep">
      <h2>Daily symptom load</h2>
      <p class="report-meta">Each day's total, 0 to 20: the worst severity (0 to 3) in each of crying, spit-up, stool, skin, and breathing, plus 2 for blood, 1 for mucus, and 2 for hives. Shaded bands are phases.</p>
      ${loadChartHtml(series, bands)}
      ${bandLegendHtml(bands)}
    </section>
    <section class="keep">
      <h2>Suspects</h2>
      <p class="report-meta">Symptom points in the ${hours} hours after eating each food, compared with a usual ${hours}-hour stretch in this range. Possibly hidden exposures count half, and a food needs two exposures to be listed.</p>
      ${suspectRows ? table(['Food', 'Exposures', `Followed within ${hours}h`, 'Load after exposure'], suspectRows) : `<p class="report-meta">No food had two exposures with a finished ${hours}-hour window in this range.</p>`}
      ${few ? `<p class="report-meta">Not enough data yet: ${esc(few)}.</p>` : ''}
      <p class="caveat">Correlation, not diagnosis. Coincidence puts innocent foods here.</p>
    </section>
    <section>
      <h2>Log</h2>
      <p class="report-meta">Oldest first. A ? after an allergen means it was possibly hidden.</p>
      ${logRows ? table(['Date', 'Time', 'Kind', 'Detail', 'Allergens'], logRows, 'log') : '<p class="report-meta">No entries in this range.</p>'}
    </section>
    <footer class="report-foot">Kept by a parent for discussion with our pediatrician. Not a diagnostic record.</footer>
  </article>`;
}

// ---- backups -----------------------------------------------------------------------------
// localStorage is the only copy of the diary, so a JSON file is the lifeboat.

// Hands a file to the share sheet (Files, Mail, AirDrop), or downloads it where
// there's no share sheet or sharing fails. Resolves false only if the parent
// closed the share sheet.
async function shareFile(file, title) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title });
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

async function exportBackup() {
  const stamp = nowTs();
  const name = `${slugify(APP_NAME)}-backup-${stamp.slice(0, 10)}.json`;
  // The file carries its own backup time and says which app wrote it.
  const file = new File([JSON.stringify({ app: APP_ID, ...S, lastBackup: stamp }, null, 2)], name, { type: 'application/json' });
  if (!(await shareFile(file, `${APP_NAME} backup`))) return;
  S.lastBackup = stamp;
  save();
  render();
  toast(`Backup saved as ${name}.`);
}

async function importBackup(file) {
  let text = '';
  try {
    text = await file.text();
  } catch {
    toast("Couldn't read that file.", { ms: 6000 });
    return;
  }
  const res = readBackup(text);
  if (!res.ok) {
    toast(res.reason === 'newer'
      ? 'That backup is from a newer version of the app. Close the app completely and reopen it to update, then try again.'
      : `That file isn't a ${APP_NAME} backup.`, { ms: 9000 });
    return;
  }
  openImportSheet(res.state, file.name, res.skipped);
}

// After a restore, land wherever the diary now belongs: the app, or setup.
function showDiary() {
  if (S.onboarded) {
    showApp();
  } else {
    U.ob = { step: 0, name: '', picks: {}, lockUntil: 0 };
    showOnboarding();
  }
}

const diaryCounts = (s) => [plural(s.foodLog.length, 'food entry', 'food entries'), plural(s.symptomLog.length, 'symptom'),
  plural(s.phases.length, 'phase'), plural(s.meals.length, 'saved meal')].join(', ');

function openImportSheet(incoming, fileName, skipped = 0) {
  const merged = mergeStates(S, incoming);
  const adding = Object.values(merged.added).reduce((a, b) => a + b, 0);
  openSheet({
    title: 'Restore from a backup',
    body: `<p class="lede">${esc(fileName)}</p>
      ${skipped ? `<p class="caution" role="note">${ICON.alert}<span>${plural(skipped, 'damaged entry', 'damaged entries')} in this file will be left out.</span></p>` : ''}
      <div class="card inset"><span class="sect-label">In the backup</span><p>${esc(diaryCounts(incoming))}</p></div>
      <div class="card inset"><span class="sect-label">On this phone now</span><p>${esc(diaryCounts(S))}</p></div>
      <div class="sect opts">
        <button class="opt" data-act="import-merge"><span class="opt-text">Merge<span class="opt-sub">${adding
          ? `Adds the ${plural(adding, 'item')} this phone doesn't have yet.` : 'This phone already has everything in the backup.'} Nothing here is changed or removed.</span></span></button>
        <button class="opt" data-act="import-replace"><span class="opt-text">Replace<span class="opt-warn">Swaps this whole diary for the backup. Anything on this phone that isn't in the backup is lost.</span></span></button>
      </div>`,
    foot: '<button class="btn" data-act="close-sheet">Cancel</button>',
    actions: {
      'import-merge': () => {
        const previous = S;
        S = merged.state;
        save();
        closeSheet();
        showDiary();
        toast(adding ? `Merged: ${plural(adding, 'item')} added.` : 'Nothing new to add.', {
          ms: 8000, actions: adding ? [{ label: 'Undo', fn: () => { S = previous; save(); showDiary(); } }] : [],
        });
      },
      'import-replace': async () => {
        const ok = await confirmDialog({
          title: 'Replace this diary?',
          body: `This phone's ${diaryCounts(S)} will be swapped for the backup's ${diaryCounts(incoming)}.`,
          ok: 'Replace', cancel: 'Keep this diary', danger: true,
        });
        if (!ok) return;
        const previous = S;
        S = incoming;
        U.day = null;
        save();
        closeSheet();
        showDiary();
        toast('Diary replaced from the backup.', {
          ms: 9000, actions: [{ label: 'Undo', fn: () => { S = previous; save(); showDiary(); } }],
        });
      },
    },
  });
}

// Tags that appear anywhere in the diary can be hidden but never deleted.
function openTagsSheet() {
  const d = { label: '' };
  const isStarter = (t) => STARTER_TAGS.some((s) => s.id === t.id);
  // Your own tags get a trailing delete column (a spacer when a tag is in use),
  // so the switches in each section line up.
  const tagRow = (t, custom) => `<div class="tagrow">
      <button class="switchrow" data-act="tag-shown" data-tag="${esc(t.id)}" role="switch" aria-checked="${!t.hidden}">
        <span>${esc(t.label)}</span><span class="switch" aria-hidden="true"></span></button>
      ${!custom ? '' : tagInUse(S, t.id)
        ? '<span class="iconbtn-space" aria-hidden="true"></span>'
        : `<button class="iconbtn" data-act="tag-delete" data-tag="${esc(t.id)}" aria-label="Delete ${esc(t.label)}">${ICON.trash}</button>`}
    </div>`;
  const listHtml = () => {
    const tags = allTags(S.settings);
    const yours = tags.filter((t) => !isStarter(t));
    return (yours.length ? `<span class="sect-label">Yours</span>${yours.map((t) => tagRow(t, true)).join('')}<span class="sect sect-label">Starter tags</span>` : '')
      + tags.filter(isStarter).map((t) => tagRow(t, false)).join('');
  };
  openSheet({
    title: 'Allergen tags',
    body: `<p class="lede">Switch a tag off to hide it from the pickers; past entries keep it. Tags you've used can be hidden, not deleted.</p>
      <div class="sect addtag">
        <label><span class="sect-label">Add your own</span>
          <input class="input" type="text" data-field="newtag" maxlength="30" autocomplete="off" enterkeyhint="done" placeholder="For example, sesame"></label>
        <button class="btn" data-act="tag-add">Add</button>
      </div>
      <p class="hint" data-region="tag-error" role="alert"></p>
      <div class="sect" data-region="tag-list">${listHtml()}</div>`,
    foot: '<button class="btn btn-primary" data-act="close-sheet" data-primary>Done</button>',
    isDirty: () => !!d.label.trim(),
    onClosed: () => render(),
    actions: {
      'tag-shown': (b) => {
        const id = b.dataset.tag;
        const hidden = new Set(S.settings.hiddenTags);
        if (hidden.has(id)) hidden.delete(id);
        else hidden.add(id);
        S.settings.hiddenTags = [...hidden];
        save();
        b.setAttribute('aria-checked', !hidden.has(id));
      },
      'tag-add': () => {
        const r = addCustomTag(S.settings, d.label);
        if (r.error) { patch('tag-error', esc(r.error)); return; }
        S.settings = r.settings;
        save();
        d.label = '';
        sheet.el.querySelector('[data-field="newtag"]').value = '';
        patch('tag-error', '');
        patch('tag-list', listHtml());
        toast(`${tagLabel(S.settings, r.id)} added.`);
      },
      'tag-delete': async (b) => {
        const id = b.dataset.tag;
        if (tagInUse(S, id)) return;
        const label = tagLabel(S.settings, id);
        const ok = await confirmDialog({ title: `Delete ${label}?`, body: "It isn't used anywhere in the diary yet.", ok: 'Delete', cancel: 'Keep it', danger: true });
        if (!ok) return;
        S.settings.customTags = S.settings.customTags.filter((t) => t.id !== id);
        S.settings.hiddenTags = S.settings.hiddenTags.filter((x) => x !== id);
        save();
        patch('tag-list', listHtml());
      },
    },
    onField: (t, type) => {
      if (t.dataset.field === 'newtag' && type === 'input') { d.label = t.value; patch('tag-error', ''); }
    },
  });
}

async function clearAllData() {
  hideToast();   // an Undo left over from earlier must not write old data into the fresh diary
  const first = await confirmDialog({
    title: 'Clear all data?',
    body: `This deletes every entry, saved meal, phase, and setting in ${APP_NAME} on this phone. Back up first if you might want any of it.`,
    ok: 'Clear everything', cancel: 'Keep my diary', danger: true,
  });
  if (!first) return;
  // Deaf to taps for a moment, so one double tap can't answer both questions.
  const second = await confirmDialog({
    title: 'Really clear everything?', body: "This can't be undone.",
    ok: 'Yes, clear it all', cancel: 'Keep my diary', danger: true, lockMs: 700,
  });
  if (!second) return;
  // Every app on this origin shares localStorage: remove only this app's keys.
  try {
    for (const key of Object.keys(localStorage)) if (key.startsWith(STORE_PREFIX)) localStorage.removeItem(key);
  } catch {}
  S = freshState();
  U.tab = 'today';
  U.day = null;
  U.ob = { step: 0, name: '', picks: {}, lockUntil: 0 };
  save();
  showOnboarding();
}

// ---- sheets ------------------------------------------------------------------------------
// Bottom sheets over the current tab. Dismiss by swiping down or tapping the
// scrim; a dirty sheet asks before throwing input away. Each sheet keeps its
// own draft and handles its own data-act buttons and fields.
let sheet = null;   // { el, scrim, isDirty, actions, onField, onClosed }

function openSheet({ title, body, foot = '', isDirty = () => false, actions = {}, onField = null, onClosed = null }) {
  if (sheet) closeSheet(true);
  // A live Undo or Time button must never float over a different sheet.
  if (performance.now() >= errorUntil) hideToast();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.dataset.act = 'close-sheet';
  const el = document.createElement('section');
  el.className = 'sheet';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', title);
  el.innerHTML = `<div class="grab" aria-hidden="true"></div>
    <header class="sheet-head"><h2>${esc(title)}</h2></header>
    <div class="sheet-body">${body}</div>
    <footer class="sheet-foot">${foot}</footer>`;
  $('#layer').append(scrim, el);
  sheet = { el, scrim, isDirty, actions, onField, onClosed };
  $('#app').inert = true;
  wireSheetDrag(el);
  el.getBoundingClientRect();   // commit the off-screen position so the slide-in animates
  scrim.classList.add('in');
  el.classList.add('in');
  return el;
}

// Swap a sheet's body (and its footer, when switching modes), keeping scroll.
function fillSheet({ body, foot = null }) {
  if (!sheet) return;
  const b = sheet.el.querySelector('.sheet-body');
  const top = b.scrollTop;
  b.innerHTML = body;
  b.scrollTop = top;
  if (foot != null) sheet.el.querySelector('.sheet-foot').innerHTML = foot;
}

// Replace one region of a sheet without touching the field being typed in.
function patch(region, html) {
  const r = sheet && sheet.el.querySelector(`[data-region="${region}"]`);
  if (r) r.innerHTML = html;
}

// Scroll the sheet body just enough to show an element (the blood caption,
// say). Done by hand: scrollIntoView can also scroll the locked page body.
function revealInSheet(selector) {
  const body = sheet && sheet.el.querySelector('.sheet-body');
  const target = body && body.querySelector(selector);
  if (!target) return;
  const overflow = target.getBoundingClientRect().bottom - body.getBoundingClientRect().bottom;
  if (overflow > 0) body.scrollTop += overflow + 12;
}

// Footers are updated in place, never re-rendered while a sheet is in use:
// typing and then tapping Save blurs the field mid-tap, and if that field's
// change event replaced the button, the tap would land on nothing.
function setFoot({ hint = '', disabled = false, label = null }) {
  if (!sheet) return;
  const foot = sheet.el.querySelector('.sheet-foot');
  const h = foot.querySelector('.foot-hint');
  if (h) h.textContent = hint;
  const b = foot.querySelector('[data-primary]');
  if (!b) return;
  b.disabled = disabled;
  if (label != null) (b.querySelector('.clip') || b).textContent = label;
}

async function requestCloseSheet() {
  if (!sheet) return;
  if (sheet.isDirty()) {
    snapSheetBack();
    const ok = await confirmDialog({
      title: 'Discard this entry?', body: "What you've entered so far will be lost.",
      ok: 'Discard', cancel: 'Keep editing', danger: true,
    });
    if (!ok) return;
  }
  closeSheet();
}

function closeSheet(instant = false) {
  if (!sheet) return;
  const { el, scrim, onClosed } = sheet;
  sheet = null;
  $('#app').inert = false;
  if (instant) {
    el.remove();
    scrim.remove();
    return;
  }
  el.classList.remove('dragging', 'in');
  el.style.transform = '';
  scrim.classList.remove('in');
  el.style.pointerEvents = scrim.style.pointerEvents = 'none';   // the fading layer must not eat the next tap
  setTimeout(() => { el.remove(); scrim.remove(); }, 320);
  if (onClosed) onClosed();
}

function snapSheetBack() {
  if (!sheet) return;
  sheet.el.classList.remove('dragging');
  sheet.el.style.transform = '';
}

// Touch events, not pointer events: iOS cancels pointer streams as soon as a
// scroller claims the gesture, and a pull-down that starts on the body at the
// top of its scroll has to win over that scroller.
function wireSheetDrag(el) {
  let d = null;
  el.addEventListener('touchstart', (e) => {
    d = null;
    if (e.touches.length !== 1 || e.target.closest('input, textarea, select')) return;
    const body = el.querySelector('.sheet-body');
    if (body.contains(e.target) && body.scrollTop > 0) return;
    d = { x0: e.touches[0].clientX, y0: e.touches[0].clientY, t0: e.timeStamp, dy: 0, on: false };
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!d) return;
    const dx = e.touches[0].clientX - d.x0;
    const dy = e.touches[0].clientY - d.y0;
    if (!d.on) {
      if (dy < -4 || Math.abs(dx) > Math.abs(dy)) { d = null; return; }
      if (dy < 8) return;
      d.on = true;
      el.classList.add('dragging');
    }
    e.preventDefault();
    d.dy = Math.max(0, dy);
    el.style.transform = `translateY(${d.dy}px)`;
  }, { passive: false });
  const end = (e) => {
    if (!d || !d.on) { d = null; return; }
    const { dy, t0 } = d;
    d = null;
    const fast = dy / Math.max(1, e.timeStamp - t0) > 0.6;
    if (dy > 110 || (fast && dy > 40)) requestCloseSheet();
    else snapSheetBack();
  };
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
}

// ---- time control ------------------------------------------------------------------
// Every entry's time defaults to now (or, when paging back through Today, that
// day at the current clock time) and can be nudged or set to any past moment.
const AGO = { now: 0, h1: 1, h3: 3 };

function defaultWhen() {
  return U.tab === 'today' && U.day ? { mode: 'at', ts: `${U.day}T${nowTs().slice(11)}` } : { mode: 'now' };
}

function resolveWhen(w) {
  const now = nowTs();
  if (w.mode in AGO) return addHours(now, -AGO[w.mode]);
  return w.ts > now ? now : w.ts;
}

function whenHtml(w) {
  const chip = (mode, label) => `<button class="chip" data-act="when" data-mode="${mode}" aria-pressed="${w.mode === mode}">${label}</button>`;
  return `<div class="when">
    <div class="chips">${chip('now', 'Now')}${chip('h1', '1h ago')}${chip('h3', '3h ago')}</div>
    <input class="date when-input" type="datetime-local" data-field="when" value="${resolveWhen(w)}" max="${nowTs()}" step="60" aria-label="Date and time">
  </div>`;
}

// Updated in place, for the same reason as setFoot.
function syncWhen(w) {
  const r = sheet && sheet.el.querySelector('[data-region="when"]');
  if (!r) return;
  for (const c of r.querySelectorAll('[data-mode]')) c.setAttribute('aria-pressed', c.dataset.mode === w.mode);
  const input = r.querySelector('input');
  const ts = resolveWhen(w);
  if (input.value.slice(0, 16) !== ts) input.value = ts;
  input.max = nowTs();
}
const whenAction = (d) => (b) => { d.when = { mode: b.dataset.mode }; syncWhen(d.when); };
function whenField(d, input) {
  const now = nowTs();
  const v = input.value.slice(0, 16);
  d.when = { mode: 'at', ts: !v ? now : v > now ? now : v };
  syncWhen(d.when);
}

// ---- meal tagging ----------------------------------------------------------------------
// The one place allergen tags get chosen, for new meals, logged entries, and
// saved meals alike. A later suggest-tags step can fill the draft before this
// renders, without touching the sheets that use it.
function tagPickerHtml(d) {
  const shown = allTags(S.settings).filter((t) => !t.hidden || tagState(d, t.id) !== 'off');
  const chips = shown.map((t) => {
    const st = tagState(d, t.id);
    return `<button class="chip" data-act="tag" data-tag="${esc(t.id)}" aria-pressed="${st === 'on' ? 'true' : st === 'maybe' ? 'mixed' : 'false'}">${esc(t.label)}</button>`;
  }).join('');
  return `<div class="chips tagpick">${chips}</div>
    <p class="hint">Tap once if it's in the meal. Tap again for possibly hidden, like takeout or packaged food.</p>`;
}

const tagAction = (d, after) => (b) => {
  Object.assign(d, cycleTag(d, b.dataset.tag));
  const st = tagState(d, b.dataset.tag);
  b.setAttribute('aria-pressed', st === 'on' ? 'true' : st === 'maybe' ? 'mixed' : 'false');
  if (after) after();
};

function mealTagsText(m) {
  return [...m.tags.map((t) => tagLabel(S.settings, t)), ...m.uncertain.map((t) => `${tagLabel(S.settings, t)}?`)].join(' · ');
}

const hasFoodInput = (d) => !!(d.name.trim() || d.tags.length || d.uncertain.length);
const sameTags = (a, b) => a.tags.length === b.tags.length && a.uncertain.length === b.uncertain.length &&
  a.tags.every((t) => b.tags.includes(t)) && a.uncertain.every((t) => b.uncertain.includes(t));
const foodName = (d) => d.name.trim() || autoMealName(S.settings, d.tags, d.uncertain);

function foodFieldsHtml(d, { withSave = false } = {}) {
  return `
    <label class="sect"><span class="sect-label">Meal</span>
      <input class="input" type="text" data-field="name" value="${esc(d.name)}" placeholder="What did you eat?" maxlength="80" autocomplete="off" enterkeyhint="done"></label>
    <div class="sect"><span class="sect-label">Allergens</span><div data-region="tags">${tagPickerHtml(d)}</div></div>
    ${'note' in d ? `<label class="sect"><span class="sect-label">Note</span>
      <textarea class="textarea" data-field="note" rows="2" maxlength="500" placeholder="Optional">${esc(d.note)}</textarea></label>` : ''}
    ${withSave ? `<button class="switchrow" data-act="save-toggle" role="switch" aria-checked="${d.save}"><span>Save to my meals</span><span class="switch" aria-hidden="true"></span></button>` : ''}
    ${'when' in d ? `<div class="sect"><span class="sect-label">When</span><div data-region="when">${whenHtml(d.when)}</div></div>` : ''}`;
}

// ---- + food ----------------------------------------------------------------------------
function openFoodSheet(draft = null) {
  const d = draft || { mode: S.meals.length ? 'pick' : 'new', q: '', name: '', tags: [], uncertain: [], note: '', save: true, when: defaultWhen() };
  const view = () => (d.mode === 'pick'
    ? { body: foodPickBody(d), foot: foodPickFoot(d) }
    : { body: foodFieldsHtml(d, { withSave: true }), foot: foodNewFoot(d) });
  openSheet({
    title: 'Log food',
    ...view(),
    isDirty: () => !!(d.q.trim() || hasFoodInput(d) || d.note.trim()),
    actions: {
      'meal-log': (b) => logMeal(b.dataset.id, d),
      'meal-edit': (b) => openMealSheet(b.dataset.id, () => openFoodSheet(d)),   // comes back with the draft intact
      'meal-new': () => {
        d.mode = 'new';
        if (!d.name.trim()) d.name = d.q.trim();
        fillSheet(view());
        if (!d.name) sheet.el.querySelector('[data-field="name"]').focus();
      },
      'food-back': () => { d.mode = 'pick'; fillSheet(view()); },
      tag: tagAction(d, () => setFoot(foodNewState(d))),
      'save-toggle': (b) => { d.save = !d.save; b.setAttribute('aria-checked', d.save); },
      when: whenAction(d),
      'food-log': () => logNewFood(d),
    },
    onField: (t, type) => {
      const f = t.dataset.field;
      if (f === 'when') { if (type === 'change') whenField(d, t); return; }
      if (type !== 'input') return;
      if (f === 'q') { d.q = t.value; patch('results', mealResultsHtml(d)); setFoot({ label: foodPickLabel(d) }); }
      else if (f === 'name') { d.name = t.value; setFoot(foodNewState(d)); }
      else if (f === 'note') d.note = t.value;
    },
  });
  if (d.mode === 'new') sheet.el.querySelector('[data-field="name"]').focus();
}

function foodPickBody(d) {
  return `
    <label class="search">${ICON.search}<span class="sr">Search your meals</span>
      <input class="input" type="search" data-field="q" value="${esc(d.q)}" placeholder="Search your meals" autocomplete="off" autocorrect="off" enterkeyhint="search"></label>
    <div data-region="results">${mealResultsHtml(d)}</div>`;
}

const foodPickLabel = (d) => (d.q.trim() ? `New meal: ${d.q.trim()}` : 'New meal');
function foodPickFoot(d) {
  return `<button class="btn btn-food" data-act="meal-new" data-primary>${ICON.plus}<span class="clip">${esc(foodPickLabel(d))}</span></button>`;
}

function mealChipHtml(m) {
  const tags = mealTagsText(m);
  return `<button class="meal-chip" data-act="meal-log" data-hold="meal-edit" data-id="${esc(m.id)}">
    <span class="mc-name">${esc(m.name)}</span>${tags ? `<span class="mc-tags">${esc(tags)}</span>` : ''}</button>`;
}

function mealResultsHtml(d) {
  const q = d.q.trim();
  if (q) {
    const hits = searchMeals(S.meals, q);
    return hits.length
      ? `<p class="sect sect-label">Matching meals</p><div class="meal-grid">${hits.slice(0, 24).map(mealChipHtml).join('')}</div>`
      : `<p class="hint">No saved meal matches &ldquo;${esc(q)}&rdquo;. Tap New meal below to log it.</p>`;
  }
  const when = d.when.mode === 'now' ? 'now' : `for ${whenLabel(resolveWhen(d.when))}`;
  return `<p class="sect sect-label">Tap a meal to log it ${esc(when)}</p>
    <div class="meal-grid">${rankMeals(S.meals, nowTs()).map(mealChipHtml).join('')}</div>
    <p class="hint">Press and hold a meal to edit it.</p>`;
}

const foodNewState = (d) => ({ hint: hasFoodInput(d) ? '' : 'Name the meal, or tap an allergen.', disabled: !hasFoodInput(d) });

function foodNewFoot(d) {
  const { hint, disabled } = foodNewState(d);
  const back = S.meals.length
    ? '<button class="btn" data-act="food-back">Back</button>'
    : '<button class="btn" data-act="close-sheet">Cancel</button>';
  return `<p class="foot-hint">${hint}</p>
    <div class="foot-row">${back}<button class="btn btn-food" data-act="food-log" data-primary${disabled ? ' disabled' : ''}>Log food</button></div>`;
}

function logMeal(id, d) {
  const m = S.meals.find((x) => x.id === id);
  if (!m) return;
  const ts = resolveWhen(d.when);
  const before = { useCount: m.useCount, lastUsed: m.lastUsed };
  const ev = { id: newId(), ts, mealId: m.id, name: m.name, tags: [...m.tags], uncertain: [...m.uncertain], note: '' };
  S.foodLog.push(ev);
  m.useCount = (m.useCount || 0) + 1;
  m.lastUsed = nowTs();
  save();
  closeSheet();
  render();
  toast(`Logged ${m.name}, ${whenLabel(ts)}`, {
    ms: 7000,
    actions: [
      { label: 'Time', fn: () => openTimeSheet(ev.id) },
      { label: 'Undo', fn: () => undoFood(ev.id, m.id, before, false) },
    ],
  });
}

// "Dairy, possibly hidden soy", for sentences.
const tagsSentence = (x) => [
  ...x.tags.map((t) => tagLabel(S.settings, t)),
  ...x.uncertain.map((t) => `possibly hidden ${tagLabel(S.settings, t).toLowerCase()}`),
].join(', ') || 'no allergens';

async function logNewFood(d) {
  if (!hasFoodInput(d) || d.busy) return;
  d.busy = true;   // a quick second tap must not log twice while the question is up
  const name = foodName(d);
  let meal = null, created = false, before = null, retagged = false;
  if (d.save) {
    // Logging a name that's already saved reuses that meal rather than adding a twin.
    meal = findMealByName(S.meals, name);
    if (meal && !sameTags(meal, d)) {
      // Different allergens this time. A one-off variation must never quietly
      // retag every later two-tap log of the meal, so ask, and default to no.
      retagged = await confirmDialog({
        title: `Update your saved ${meal.name}?`,
        body: `Saved with: ${tagsSentence(meal)}. This time: ${tagsSentence(d)}. Updating changes what future quick logs of it record.`,
        ok: 'Update saved meal', cancel: 'Just this time',
      });
    }
    if (!meal) {
      meal = { id: newId(), name, tags: [...d.tags], uncertain: [...d.uncertain], useCount: 0, lastUsed: null };
      S.meals.push(meal);
      created = true;
    }
    before = { useCount: meal.useCount, lastUsed: meal.lastUsed, tags: [...meal.tags], uncertain: [...meal.uncertain] };
    if (retagged) Object.assign(meal, { tags: [...d.tags], uncertain: [...d.uncertain] });
    meal.useCount = (meal.useCount || 0) + 1;
    meal.lastUsed = nowTs();
  }
  const ts = resolveWhen(d.when);
  const ev = { id: newId(), ts, mealId: meal ? meal.id : null, name, tags: [...d.tags], uncertain: [...d.uncertain], note: d.note.trim() };
  S.foodLog.push(ev);
  save();
  closeSheet();
  render();
  toast(`Logged ${name}, ${whenLabel(ts)}.${retagged ? ' Saved meal updated.' : ''}`, {
    ms: 7000,
    actions: [{ label: 'Undo', fn: () => undoFood(ev.id, meal && meal.id, before, created) }],
  });
}

function undoFood(eventId, mealId, before, createdMeal) {
  S.foodLog = S.foodLog.filter((e) => e.id !== eventId);
  const m = mealId && S.meals.find((x) => x.id === mealId);
  if (m && createdMeal && !S.foodLog.some((e) => e.mealId === mealId)) S.meals = S.meals.filter((x) => x.id !== mealId);
  else if (m && before) Object.assign(m, before);
  save();
  render();
  toast('Removed.');
}

// The toast's "Time" shortcut: a small sheet with only the time control.
function openTimeSheet(id) {
  const ev = S.foodLog.find((e) => e.id === id);
  if (!ev) return;
  const d = { when: { mode: 'at', ts: ev.ts } };
  const start = ev.ts;
  openSheet({
    title: `When did you eat ${ev.name}?`,
    body: `<div data-region="when">${whenHtml(d.when)}</div>`,
    foot: '<button class="btn btn-food" data-act="time-save">Save time</button>',
    isDirty: () => resolveWhen(d.when) !== start,
    actions: {
      when: whenAction(d),
      'time-save': () => {
        ev.ts = resolveWhen(d.when);
        save();
        closeSheet();
        render();
        toast(`Moved to ${whenLabel(ev.ts)}.`);
      },
    },
    onField: (t, type) => { if (t.dataset.field === 'when' && type === 'change') whenField(d, t); },
  });
}

function openFoodEdit(id) {
  const ev = S.foodLog.find((e) => e.id === id);
  if (!ev) return;
  const d = { name: ev.name, tags: [...(ev.tags || [])], uncertain: [...(ev.uncertain || [])], note: ev.note || '', when: { mode: 'at', ts: ev.ts } };
  const start = JSON.stringify(d);
  openSheet({
    title: 'Edit food',
    body: `${ev.mealId ? '<p class="lede">Changes here affect only this entry, not your saved meal.</p>' : ''}${foodFieldsHtml(d)}`,
    foot: `<p class="foot-hint"></p>
      <div class="foot-row"><button class="btn btn-quiet-danger" data-act="delete">Delete</button>
      <button class="btn btn-food" data-act="save" data-primary>Save</button></div>`,
    isDirty: () => JSON.stringify(d) !== start,
    actions: {
      tag: tagAction(d, () => setFoot(foodNewState(d))),
      when: whenAction(d),
      save: () => {
        if (!hasFoodInput(d)) return;
        Object.assign(ev, { name: foodName(d), tags: [...d.tags], uncertain: [...d.uncertain], note: d.note.trim(), ts: resolveWhen(d.when) });
        save();
        closeSheet();
        render();
        toast(dayKey(ev.ts) === viewDay() ? 'Saved.' : `Saved, and moved to ${whenLabel(ev.ts)}.`);
      },
      delete: () => deleteEntry('food', id),
    },
    onField: (t, type) => {
      const f = t.dataset.field;
      if (f === 'when') { if (type === 'change') whenField(d, t); return; }
      if (type !== 'input') return;
      if (f === 'name') { d.name = t.value; setFoot(foodNewState(d)); }
      else if (f === 'note') d.note = t.value;
    },
  });
}

// Editing a saved meal changes future logs only; entries keep their copies.
function openMealSheet(id, back = null) {
  const m = S.meals.find((x) => x.id === id);
  if (!m) return;
  const d = { name: m.name, tags: [...m.tags], uncertain: [...m.uncertain] };
  const start = JSON.stringify(d);
  const foot = `<div class="foot-row"><button class="btn btn-quiet-danger" data-act="remove">Remove</button>
    <button class="btn btn-food" data-act="save" data-primary>Save meal</button></div>`;
  closeSheet(true);
  openSheet({
    title: 'Edit saved meal',
    body: `<p class="lede">Changes apply the next time you log it. Past entries keep what they were logged with.</p>
      ${foodFieldsHtml(d)}
      <p class="fine sect">Logged ${plural(m.useCount || 0, 'time')}.</p>`,
    foot,
    isDirty: () => JSON.stringify(d) !== start,
    actions: {
      tag: tagAction(d),
      save: () => {
        if (!d.name.trim()) return;
        Object.assign(m, { name: d.name.trim(), tags: [...d.tags], uncertain: [...d.uncertain] });
        save();
        closeSheet();
        toast('Meal saved.');
      },
      remove: async () => {
        const ok = await confirmDialog({
          title: `Remove ${m.name} from your meals?`, body: 'Past entries stay in the diary.',
          ok: 'Remove', cancel: 'Keep it', danger: true,
        });
        if (!ok) return;
        S.meals = S.meals.filter((x) => x.id !== m.id);
        save();
        closeSheet();
        toast('Meal removed.');
      },
    },
    onField: (t, type) => {
      if (t.dataset.field === 'name' && type === 'input') { d.name = t.value; setFoot({ disabled: !d.name.trim() }); }
    },
    onClosed: back,   // back to the food sheet it was opened from
  });
}

async function deleteEntry(kind, id) {
  const list = kind === 'food' ? 'foodLog' : 'symptomLog';
  const ev = S[list].find((e) => e.id === id);
  if (!ev) return;
  const ok = await confirmDialog({
    title: 'Delete this entry?', body: `${kind === 'food' ? ev.name : symptomName(ev)}, ${whenLabel(ev.ts)}`,
    ok: 'Delete', cancel: 'Keep it', danger: true,
  });
  if (!ok) return;
  S[list] = S[list].filter((e) => e.id !== id);
  save();
  closeSheet();
  render();
  toast('Entry deleted.', { actions: [{ label: 'Undo', fn: () => { S[list].push(ev); save(); render(); } }] });
}

// ---- + symptom -------------------------------------------------------------------------
// Common case, a loose diaper: + symptom, Stool, Loose, Log. Four taps.
function openSymptomSheet(id = null) {
  const ev = id ? S.symptomLog.find((e) => e.id === id) : null;
  if (id && !ev) return;
  const d = ev
    ? { cat: ev.cat, severity: ev.cat === 'stool' ? null : ev.severity, consistency: ev.consistency || null, flags: [...(ev.flags || [])], note: ev.note || '', when: { mode: 'at', ts: ev.ts } }
    : { cat: null, severity: null, consistency: null, flags: [], note: '', when: defaultWhen() };
  const start = JSON.stringify(d);
  const refresh = () => { fillSheet({ body: symptomBody(d) }); setFoot(symptomState(d, !!ev)); };
  openSheet({
    title: ev ? 'Edit symptom' : 'Log a symptom',
    body: symptomBody(d),
    foot: symptomFoot(d, !!ev),
    isDirty: ev ? () => JSON.stringify(d) !== start : () => !!(d.severity != null || d.consistency || d.flags.length || d.note.trim()),
    actions: {
      cat: (b) => {
        const c = b.dataset.cat;
        if (c !== d.cat) {
          Object.assign(d, { cat: c, severity: null, consistency: null });
          d.flags = d.flags.filter((f) => (CAT_FLAGS[c] || []).includes(f));
        }
        refresh();
      },
      sev: (b) => { d.severity = +b.dataset.sev; refresh(); },
      stool: (b) => { d.consistency = b.dataset.stool; refresh(); },
      flag: (b) => {
        const f = b.dataset.flag;
        d.flags = d.flags.includes(f) ? d.flags.filter((x) => x !== f) : [...d.flags, f];
        refresh();
        if (f === 'blood' && d.flags.includes('blood')) revealInSheet('.caution');
      },
      when: whenAction(d),
      'sym-log': () => saveSymptom(d, ev),
      delete: () => deleteEntry('symptom', ev.id),
    },
    onField: (t, type) => {
      if (t.dataset.field === 'note') d.note = t.value;
      else if (t.dataset.field === 'when' && type === 'change') whenField(d, t);
    },
  });
}

const noteHtml = (d, label, placeholder) => `<label class="sect"><span class="sect-label">${label}</span>
  <textarea class="textarea" data-field="note" rows="2" maxlength="500" placeholder="${placeholder}">${esc(d.note)}</textarea></label>`;

function symptomBody(d) {
  const cats = SYMPTOM_CATS.map((c) =>
    `<button class="cat" data-act="cat" data-cat="${c}" aria-pressed="${d.cat === c}">${ICON[c]}<span>${CATS[c].label}</span></button>`).join('');
  return `<div class="cat-grid" role="group" aria-label="What did you notice?">${cats}</div>${d.cat ? symptomDetailHtml(d) : ''}`;
}

function symptomDetailHtml(d) {
  const c = d.cat;
  let html = c === 'other' ? noteHtml(d, 'What happened?', 'Describe it') : '';
  if (c === 'stool') {
    html += `<div class="sect"><span class="sect-label">Consistency</span><div class="opts" role="radiogroup" aria-label="Consistency">${STOOLS.map((s) => `
      <button class="opt" role="radio" data-act="stool" data-stool="${s.id}" aria-checked="${d.consistency === s.id}">
        <span class="num">${STOOL_SEVERITY[s.id]}</span><span class="opt-text">${s.label}${s.sub ? `<span class="opt-sub">${s.sub}</span>` : ''}</span></button>`).join('')}
      </div></div>`;
  } else {
    html += `<div class="sect"><span class="sect-label">How bad?</span><div class="opts" role="radiogroup" aria-label="Severity">${[1, 2, 3].map((n) => `
      <button class="opt" role="radio" data-act="sev" data-sev="${n}" aria-checked="${d.severity === n}">
        <span class="num">${n}</span><span class="opt-text">${esc(CATS[c].anchors[n - 1])}${c === 'resp' && n === 3 ? `<span class="opt-warn">${RESP_WARNING}</span>` : ''}</span></button>`).join('')}
      </div></div>`;
  }
  if (CAT_FLAGS[c]) {
    html += `<div class="sect"><span class="sect-label">Also noticed</span>
      <div class="chips flagpick">${CAT_FLAGS[c].map((f) => `<button class="chip" data-act="flag" data-flag="${f}" aria-pressed="${d.flags.includes(f)}">${FLAG_LABELS[f]}</button>`).join('')}</div>
      ${d.flags.includes('blood') ? `<p class="caution" role="note">${ICON.alert}<span>${BLOOD_WARNING}</span></p>` : ''}</div>`;
  }
  html += `<div class="sect"><span class="sect-label">When</span><div data-region="when">${whenHtml(d.when)}</div></div>`;
  if (c !== 'other') html += noteHtml(d, 'Note', 'Optional');
  return html;
}

const SYMPTOM_HINTS = {
  category: 'Pick what you noticed.',
  consistency: 'Pick a consistency.',
  severity: 'Pick how bad it is.',
  formed: 'A formed stool is normal. Add mucus or blood to log it.',
};

function symptomState(d, editing) {
  const missing = symptomMissing(d);
  return {
    hint: SYMPTOM_HINTS[missing] || '',
    disabled: !!missing,
    label: editing ? 'Save' : missing ? 'Log' : `Log ${symptomName(d).toLowerCase()}`,
  };
}

function symptomFoot(d, editing) {
  const { hint, disabled, label } = symptomState(d, editing);
  const btn = `<button class="btn btn-symptom" data-act="sym-log" data-primary${disabled ? ' disabled' : ''}>${esc(label)}</button>`;
  return `<p class="foot-hint">${hint}</p>${editing
    ? `<div class="foot-row"><button class="btn btn-quiet-danger" data-act="delete">Delete</button>${btn}</div>`
    : btn}`;
}

function saveSymptom(d, ev) {
  if (symptomMissing(d)) return;
  const fields = symptomFields(d);
  const ts = resolveWhen(d.when);
  if (ev) {
    delete ev.consistency;
    Object.assign(ev, fields, { ts });
    save();
    closeSheet();
    render();
    toast(dayKey(ts) === viewDay() ? 'Saved.' : `Saved, and moved to ${whenLabel(ts)}.`);
    return;
  }
  const e = { id: newId(), ts, ...fields };
  S.symptomLog.push(e);
  save();
  closeSheet();
  render();
  toast(`Logged ${symptomName(e).toLowerCase()}, ${whenLabel(ts)}`, {
    ms: 6000,
    actions: [{ label: 'Undo', fn: () => { S.symptomLog = S.symptomLog.filter((x) => x.id !== e.id); save(); render(); toast('Removed.'); } }],
  });
}

// ---- phases ------------------------------------------------------------------------------
function openPhaseSheet(id = null) {
  const p = id ? S.phases.find((x) => x.id === id) : null;
  if (id && !p) return;
  const today = todayKey();
  const d = p
    ? { kind: p.kind, tag: p.tag, start: dayKey(p.start), ended: p.end != null, end: p.end ? dayKey(p.end) : today, note: p.note || '' }
    : { kind: 'eliminate', tag: null, start: today, ended: false, end: today, note: '', closeElim: true };
  const start = JSON.stringify(d);
  const refresh = () => { fillSheet({ body: phaseBody(d, p) }); setFoot(phaseState(d)); };
  openSheet({
    title: p ? 'Edit phase' : 'Add a phase',
    body: phaseBody(d, p),
    foot: phaseFoot(d, p),
    isDirty: () => JSON.stringify(d) !== start,
    actions: {
      kind: (b) => { d.kind = b.dataset.kind; refresh(); },
      ptag: (b) => { d.tag = b.dataset.tag; refresh(); },
      ended: (b) => { d.ended = b.dataset.ended === '1'; refresh(); },
      'close-elim': (b) => { d.closeElim = !d.closeElim; b.setAttribute('aria-checked', d.closeElim); },
      'phase-save': () => savePhase(d, p),
      delete: () => deletePhase(p),
    },
    onField: (t, type) => {
      const f = t.dataset.field;
      if (f === 'note') d.note = t.value;
      else if ((f === 'start' || f === 'end') && type === 'change') {
        d[f] = t.value || today;
        if (f === 'start') patch('closing', closingHtml(d, p));
        setFoot(phaseState(d));
      }
    },
  });
}

// Offer to end a running elimination when its food's reintroduction begins.
function closingHtml(d, p) {
  const closing = !p && !d.ended && d.kind === 'reintroduce' && d.tag ? phasesToClose(S.phases, d.tag, `${d.start}T00:00`) : [];
  return closing.length ? `<button class="switchrow" data-act="close-elim" role="switch" aria-checked="${d.closeElim}">
    <span>Also end the ${esc(tagLabel(S.settings, d.tag).toLowerCase())} elimination when this starts</span><span class="switch" aria-hidden="true"></span></button>` : '';
}

function phaseBody(d, p) {
  const tags = allTags(S.settings).filter((t) => !t.hidden || t.id === d.tag);
  const seg = (act, key, value, label, on) => `<button data-act="${act}" data-${key}="${value}" aria-pressed="${on}">${label}</button>`;
  return `
    <div class="sect"><span class="sect-label">Type</span>
      <div class="seg">${seg('kind', 'kind', 'eliminate', 'Eliminate', d.kind === 'eliminate')}${seg('kind', 'kind', 'reintroduce', 'Reintroduce', d.kind === 'reintroduce')}</div>
      <p class="hint">${d.kind === 'eliminate' ? 'Taking a food out of your diet.' : 'Bringing one food back. Watch 48 to 72 hours after each try before changing anything else.'}</p>
    </div>
    <div class="sect"><span class="sect-label">Food</span>
      <div class="chips">${tags.map((t) => `<button class="chip" data-act="ptag" data-tag="${esc(t.id)}" aria-pressed="${d.tag === t.id}">${esc(t.label)}</button>`).join('')}</div>
      <div data-region="closing">${closingHtml(d, p)}</div>
    </div>
    <label class="sect"><span class="sect-label">Started</span><input class="date wide" type="date" data-field="start" value="${d.start}"></label>
    <div class="sect"><span class="sect-label">Status</span>
      <div class="seg">${seg('ended', 'ended', '0', 'Still going', !d.ended)}${seg('ended', 'ended', '1', 'Ended', d.ended)}</div>
      ${d.ended ? `<label class="sect"><span class="sect-label">Ended on</span><input class="date wide" type="date" data-field="end" value="${d.end}"></label>` : ''}
    </div>
    ${noteHtml(d, 'Note', 'Optional')}`;
}

function phaseProblem(d) {
  if (!d.tag) return 'Pick a food.';
  if (d.ended && d.end <= d.start) return 'The end date needs to be after the start date.';
  return '';
}

const phaseState = (d) => ({ hint: phaseProblem(d), disabled: !!phaseProblem(d) });

function phaseFoot(d, p) {
  const problem = phaseProblem(d);
  const btn = `<button class="btn btn-primary" data-act="phase-save" data-primary${problem ? ' disabled' : ''}>${p ? 'Save' : 'Add phase'}</button>`;
  return `<p class="foot-hint">${problem}</p>${p
    ? `<div class="foot-row"><button class="btn btn-quiet-danger" data-act="delete">Delete</button>${btn}</div>`
    : btn}`;
}

function savePhase(d, p) {
  if (phaseProblem(d)) return;
  const fields = { kind: d.kind, tag: d.tag, start: `${d.start}T00:00`, end: d.ended ? `${d.end}T00:00` : null, note: d.note.trim() };
  let msg = p ? 'Phase saved.' : 'Phase added.';
  if (p) {
    Object.assign(p, fields);
  } else {
    const phase = { id: newId(), ...fields };
    if (d.kind === 'reintroduce' && !d.ended && d.closeElim) {
      const closing = phasesToClose(S.phases, d.tag, fields.start);
      for (const x of closing) x.end = fields.start;
      if (closing.length) {
        phase.closes = closing.map((x) => x.id);   // lets deleting this phase reopen them
        msg = `Phase added, and the ${tagLabel(S.settings, d.tag).toLowerCase()} elimination ended.`;
      }
    }
    S.phases.push(phase);
  }
  save();
  closeSheet();
  render();
  toast(msg);
}

async function deletePhase(p) {
  const label = `${tagLabel(S.settings, p.tag)} ${p.kind === 'reintroduce' ? 'reintroduction' : 'elimination'}`;
  const ok = await confirmDialog({
    title: 'Delete this phase?', body: `${label}, since ${fmtDate(p.start)}. Your food and symptom entries stay.`,
    ok: 'Delete', cancel: 'Keep it', danger: true,
  });
  if (!ok) return;
  S.phases = S.phases.filter((x) => x.id !== p.id);
  // Reopen eliminations this reintroduction ended, unless they've been changed since.
  const reopened = S.phases.filter((x) => (p.closes || []).includes(x.id) && x.end === p.start);
  for (const x of reopened) x.end = null;
  save();
  closeSheet();
  render();
  toast(reopened.length
    ? `Phase deleted, and the ${tagLabel(S.settings, p.tag).toLowerCase()} elimination is running again.`
    : 'Phase deleted.');
}

// ---- dialogs and toast -----------------------------------------------------------------
// Confirm sits at the bottom, in thumb reach; Cancel is the lowest button.
let dialog = null;

function confirmDialog({ title, body = '', ok = 'OK', cancel = 'Cancel', danger = false, lockMs = 0 }) {
  if (performance.now() >= errorUntil) hideToast();   // no stray Undo above a question
  return new Promise((resolve) => {
    const scrim = document.createElement('div');
    scrim.className = 'scrim top';
    const el = document.createElement('section');
    el.className = 'dialog';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', title);
    el.innerHTML = `<h2>${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}
      <div class="dialog-btns">
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-dlg="ok">${esc(ok)}</button>
        <button class="btn" data-dlg="cancel">${esc(cancel)}</button>
      </div>`;
    const finish = (value) => {
      dialog = null;
      el.classList.remove('in');
      scrim.classList.remove('in');
      el.style.pointerEvents = scrim.style.pointerEvents = 'none';
      setTimeout(() => { el.remove(); scrim.remove(); }, 240);
      resolve(value);
    };
    const openedAt = performance.now();
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-dlg]');
      if (b && performance.now() - openedAt >= lockMs) finish(b.dataset.dlg === 'ok');
    });
    scrim.addEventListener('click', () => finish(false));
    $('#layer').append(scrim, el);
    dialog = { finish };
    el.getBoundingClientRect();
    scrim.classList.add('in');
    el.classList.add('in');
    el.querySelector('[data-dlg="cancel"]').focus({ preventScroll: true });
  });
}

let toastTimer = 0;
let errorUntil = 0;   // a save error outranks the "Logged" confirmation that would follow it
function toast(msg, { actions = [], ms = 4000, error = false } = {}) {
  if (!error && performance.now() < errorUntil) return;
  if (error) errorUntil = performance.now() + ms;
  const el = $('#toast');
  el.innerHTML = `<span class="toast-msg">${esc(msg)}</span>${actions.map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`).join('')}`;
  el.onclick = (e) => {
    const b = e.target.closest('button');
    hideToast();
    if (b) actions[+b.dataset.i].fn();
  };
  el.classList.add('in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { $('#toast').classList.remove('in'); }

// ---- updates (service worker) ------------------------------------------------------------
// The worker only caches the app's own files. The browser checks sw.js for a
// new version on launch and when the app comes back to the foreground; no
// diary data is involved.
let swReg = null;
let updateRequested = false;

function initServiceWorker() {
  if (!('serviceWorker' in navigator) || !isSecureContext) return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) updateReady();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w?.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) updateReady();
      });
    });
  }).catch(() => {});
  // First install also fires this (clients.claim); only reload when asked to.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (updateRequested) location.reload();
  });
}

function updateReady() {
  if (blocked) { applyUpdate(); return; }   // nothing on screen to lose
  $('#update').hidden = false;
}

async function applyUpdate() {
  if (sheet?.isDirty()) {
    const ok = await confirmDialog({
      title: 'Reload and lose this entry?', body: 'Save or discard it first to keep it.',
      ok: 'Reload anyway', cancel: 'Keep editing', danger: true,
    });
    if (!ok) return;
  }
  const waiting = swReg?.waiting;
  if (!waiting) { location.reload(); return; }
  updateRequested = true;
  waiting.postMessage('skipWaiting');
}

async function checkForUpdate() {
  try { await swReg?.update(); } catch {}
  if (swReg?.waiting) { applyUpdate(); return; }
  if (swReg?.installing) { toast('Downloading the update...'); return; }
  toast('No update found yet. Close the app completely and open it again.', { ms: 6000 });
}

// ---- events --------------------------------------------------------------------------------
const ACTIONS = {
  tab: (el) => setTab(el.dataset.tab),
  'add-food': () => openFoodSheet(),
  'add-symptom': () => openSymptomSheet(),
  'close-sheet': () => requestCloseSheet(),
  'apply-update': () => applyUpdate(),
  'check-update': () => checkForUpdate(),
  'edit-food': (el) => openFoodEdit(el.dataset.id),
  'edit-symptom': (el) => openSymptomSheet(el.dataset.id),
  'edit-phase': (el) => openPhaseSheet(el.dataset.id),
  'add-phase': () => openPhaseSheet(),
  'day-prev': () => pageDay(-1),
  'day-next': () => pageDay(1),
  'day-today': () => { U.day = null; render(); },
  'trend-range': (el) => { U.trendRange = el.dataset.range; render(); },
  window: (el) => { S.settings.windowHours = +el.dataset.hours; save(); render(); },
  'open-report': () => showReport(),
  'report-close': () => { showScreen('app'); render(); },
  'report-print': () => printReport(),
  'report-share': () => shareReport(),
  'report-range': (el) => {
    const { fromDay, toDay } = trendDays(S, el.dataset.range, todayKey());
    U.report = { preset: el.dataset.range, from: fromDay, to: toDay };
    renderReport();
  },
  'export': () => exportBackup(),
  'import': () => $('#import-file').click(),
  'edit-name': () => openNameSheet(),
  'edit-tags': () => openTagsSheet(),
  'clear-all': () => clearAllData(),
  'backup-now': () => exportBackup(),
  'backup-later': () => {
    S.backupSnoozed = nowTs();
    save();
    render();
    toast('Reminder hidden for a week.');
  },
  dismiss: (el) => {
    S.dismissed = [...pruneDismissed(S, nowTs()), el.dataset.key];
    save();
    render();
  },
  'ob-next': () => obGo(1),
  'ob-back': () => obGo(-1),
  'ob-pick': (el) => {
    const id = el.dataset.tag;
    if (id in U.ob.picks) delete U.ob.picks[id];
    else U.ob.picks[id] = todayKey();
    renderOnboard();
  },
  'ob-finish': () => { if (performance.now() >= U.ob.lockUntil) finishOnboarding(); },
};

// Each onboarding step puts its main button where the last one was, so a quick
// double tap would skip a step. Ignore taps for a moment after moving.
function obGo(delta) {
  if (performance.now() < U.ob.lockUntil) return;
  U.ob.step += delta;
  U.ob.lockUntil = performance.now() + 450;
  renderOnboard();
}

// Press and hold on anything with data-hold runs that action instead of a tap.
let holdTimer = 0;
let holdStart = null;
let holdFired = false;
let suppressClickUntil = 0;
function runHold(el) {
  holdFired = true;
  suppressClickUntil = performance.now() + 800;
  const act = el.dataset.hold;
  const fn = (sheet && sheet.el.contains(el) && sheet.actions[act]) || ACTIONS[act];
  if (fn) fn(el);
}
document.addEventListener('touchstart', (e) => {
  clearTimeout(holdTimer);
  holdFired = false;
  const el = e.target.closest('[data-hold]');
  if (!el || e.touches.length !== 1) { holdStart = null; return; }
  holdStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  holdTimer = setTimeout(() => runHold(el), 500);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (holdStart && Math.hypot(e.touches[0].clientX - holdStart.x, e.touches[0].clientY - holdStart.y) > 10) clearTimeout(holdTimer);
}, { passive: true });
// Releasing a hold would otherwise send a click to whatever the new sheet put
// under the finger (an allergen chip, Remove). Cancel it at the source.
document.addEventListener('touchend', (e) => {
  clearTimeout(holdTimer);
  if (holdFired) {
    holdFired = false;
    e.preventDefault();
  }
}, { passive: false });
document.addEventListener('touchcancel', () => clearTimeout(holdTimer));
document.addEventListener('contextmenu', (e) => {
  const el = e.target.closest('[data-hold]');
  if (!el) return;
  e.preventDefault();
  clearTimeout(holdTimer);
  if (performance.now() >= suppressClickUntil) runHold(el);
});

document.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.matches('input[data-field="day"]')) { try { e.target.showPicker(); } catch {} return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const fn = (sheet && sheet.el.contains(el) && sheet.actions[act]) || ACTIONS[act];
  if (fn) fn(el, e);
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'ob-name') U.ob.name = t.value;
  else if (sheet && sheet.onField && sheet.el.contains(t)) sheet.onField(t, 'input');
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.since) {
    const max = todayKey();
    // A cleared date falls back to today; a future date clamps to today.
    U.ob.picks[t.dataset.since] = !t.value || t.value > max ? max : t.value;
    t.value = U.ob.picks[t.dataset.since];
  } else if (t.dataset.field === 'day' && !sheet) {
    jumpToDay(t.value);
  } else if (t.id === 'import-file') {
    const file = t.files && t.files[0];
    t.value = '';   // so choosing the same file again still fires
    if (file) importBackup(file);
  } else if ((t.dataset.field === 'report-from' || t.dataset.field === 'report-to') && U.report) {
    const today = todayKey();
    const value = !t.value || t.value > today ? today : t.value;
    const next = { ...U.report, preset: null, [t.dataset.field === 'report-from' ? 'from' : 'to']: value };
    if (next.from > next.to) [next.from, next.to] = [next.to, next.from];
    U.report = next;
    renderReport();
  } else if (sheet && sheet.onField && sheet.el.contains(t)) {
    sheet.onField(t, 'change');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'ob-name') {
    e.preventDefault();
    e.target.blur();
    ACTIONS['ob-next']();
  } else if (e.key === 'Enter' && sheet && e.target.dataset && e.target.dataset.field === 'newtag') {
    e.preventDefault();
    sheet.actions['tag-add']();
  } else if (e.key === 'Enter' && e.target.matches('.sheet input')) {
    e.preventDefault();
    e.target.blur();   // "done" on the keyboard just puts it away
  } else if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key) && chartOf(e.target) === e.target && charts.has(e.target.id)) {
    e.preventDefault();
    const n = charts.get(e.target.id).length;
    const cur = e.target.dataset.sel != null ? +e.target.dataset.sel : n - 1;
    chartTip(e.target, e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : cur + (e.key === 'ArrowLeft' ? -1 : 1));
  } else if (e.key === 'Escape') {
    if (dialog) dialog.finish(false);
    else if (sheet) requestCloseSheet();
  }
});

// Coming back to the app later (or past midnight) should show the real today.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S && !blocked && document.body.dataset.screen === 'app') render();
  swReg?.update().catch(() => {});
});

// ---- boot ------------------------------------------------------------------------------------
function boot() {
  document.title = APP_NAME;
  fitShell();
  addEventListener('resize', fitShell);
  initServiceWorker();
  let raw;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch {
    showBlocked('nostorage');
    return;
  }
  const res = readState(raw);
  if (!res.ok && res.reason === 'newer') { showBlocked('newer'); return; }
  let notice = '';
  if (!res.ok) {
    // Set the unreadable text aside under its own key before starting over.
    try {
      localStorage.setItem(`${STORE_KEY}:unreadable:${nowTs()}`, raw);
    } catch {
      showBlocked('unreadable');
      return;
    }
    S = freshState();
    save();
    notice = "The saved diary couldn't be read, so a copy was set aside and a fresh diary started.";
  } else {
    S = res.state;
    if (res.migrated) save();
  }
  if (S.onboarded) showApp();
  else showOnboarding();
  if (notice) toast(notice, { ms: 9000 });
}

boot();
</script>
