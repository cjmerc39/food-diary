  },
  'ob-next': () => obGo(1),
  'ob-back': () => obGo(-1),
  'ob-pick': (el) => {
    const id = el.dataset.tag;
    if (id in U.ob.picks) delete U.ob.picks[id];
    else U.ob.picks[id] = todayKey();
    renderOnboard();
  },
  'ob-finish': () => { if (performance.now() >= U.ob.lockUntil) finishOnboarding(); },
};

// Each onboarding step puts its main button where the last one was, so a quick
// double tap would skip a step. Ignore taps for a moment after moving.
function obGo(delta) {
  if (performance.now() < U.ob.lockUntil) return;
  U.ob.step += delta;
  U.ob.lockUntil = performance.now() + 450;
  renderOnboard();
}

// Press and hold on anything with data-hold runs that action instead of a tap.
let holdTimer = 0;
let holdStart = null;
let holdFired = false;
let suppressClickUntil = 0;
function runHold(el) {
  holdFired = true;
  suppressClickUntil = performance.now() + 800;
  const act = el.dataset.hold;
  const fn = (sheet && sheet.el.contains(el) && sheet.actions[act]) || ACTIONS[act];
  if (fn) fn(el);
}
document.addEventListener('touchstart', (e) => {
  clearTimeout(holdTimer);
  holdFired = false;
  const el = e.target.closest('[data-hold]');
  if (!el || e.touches.length !== 1) { holdStart = null; return; }
  holdStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  holdTimer = setTimeout(() => runHold(el), 500);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (holdStart && Math.hypot(e.touches[0].clientX - holdStart.x, e.touches[0].clientY - holdStart.y) > 10) clearTimeout(holdTimer);
}, { passive: true });
// Releasing a hold would otherwise send a click to whatever the new sheet put
// under the finger (an allergen chip, Remove). Cancel it at the source.
document.addEventListener('touchend', (e) => {
  clearTimeout(holdTimer);
  if (holdFired) {
    holdFired = false;
    e.preventDefault();
  }
}, { passive: false });
document.addEventListener('touchcancel', () => clearTimeout(holdTimer));
document.addEventListener('contextmenu', (e) => {
  const el = e.target.closest('[data-hold]');
  if (!el) return;
  e.preventDefault();
  clearTimeout(holdTimer);
  if (performance.now() >= suppressClickUntil) runHold(el);
});

document.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.matches('input[data-field="day"]')) { try { e.target.showPicker(); } catch {} return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const fn = (sheet && sheet.el.contains(el) && sheet.actions[act]) || ACTIONS[act];
  if (fn) fn(el, e);
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'ob-name') U.ob.name = t.value;
  else if (sheet && sheet.onField && sheet.el.contains(t)) sheet.onField(t, 'input');
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.since) {
    const max = todayKey();
    // A cleared date falls back to today; a future date clamps to today.
    U.ob.picks[t.dataset.since] = !t.value || t.value > max ? max : t.value;
    t.value = U.ob.picks[t.dataset.since];
  } else if (t.dataset.field === 'day' && !sheet) {
    jumpToDay(t.value);
  } else if (sheet && sheet.onField && sheet.el.contains(t)) {
    sheet.onField(t, 'change');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'ob-name') {
    e.preventDefault();
    e.target.blur();
    ACTIONS['ob-next']();
  } else if (e.key === 'Enter' && e.target.matches('.sheet input')) {
    e.preventDefault();
    e.target.blur();   // "done" on the keyboard just puts it away
  } else if (e.key === 'Escape') {
    if (dialog) dialog.finish(false);
    else if (sheet) requestCloseSheet();
  }
});

// Coming back to the app later (or past midnight) should show the real today.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S && !blocked && document.body.dataset.screen === 'app') render();
  swReg?.update().catch(() => {});
});

// ---- boot ------------------------------------------------------------------------------------
function boot() {
  document.title = APP_NAME;
  fitShell();
  addEventListener('resize', fitShell);
  initServiceWorker();
  let raw;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch {
    showBlocked('nostorage');
    return;
  }
  const res = readState(raw);
  if (!res.ok && res.reason === 'newer') { showBlocked('newer'); return; }
  let notice = '';
  if (!res.ok) {
    // Set the unreadable text aside under its own key before starting over.
    try {
      localStorage.setItem(`${STORE_KEY}:unreadable:${nowTs()}`, raw);
    } catch {
      showBlocked('unreadable');
      return;
    }
    S = freshState();
    save();
    notice = "The saved diary couldn't be read, so a copy was set aside and a fresh diary started.";
  } else {
    S = res.state;
    if (res.migrated) save();
  }
  if (S.onboarded) showApp();
  else showOnboarding();
  if (notice) toast(notice, { ms: 9000 });
}

boot();
</script>
</body>
</html>
